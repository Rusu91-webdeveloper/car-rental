name: Booking lifecycle workers

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-booking-workers
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APP_BASE_URL: ${{ vars.PRODUCTION_APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Validate worker configuration
        shell: bash
        run: |
          test -n "$APP_BASE_URL"
          test -n "$CRON_SECRET"

      - name: Expire unpaid reservations
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 2 \
            --retry-all-errors \
            --max-time 70 \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$APP_BASE_URL/api/cron/cancel-expired-bookings"

      - name: Deliver booking notifications
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 2 \
            --retry-all-errors \
            --max-time 70 \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$APP_BASE_URL/api/cron/booking-notifications"
